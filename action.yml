name: 'Busbar Permissions Audit'
description: 'Cedar-based security analysis of Salesforce metadata — permissions, sharing, FLS, flows'
author: 'busbar.agency'
branding:
  icon: 'lock'
  color: 'orange'

inputs:
  metadata-path:
    description: 'Directory or MDAPI zip of Salesforce metadata to audit (e.g. force-app/main/default).'
    required: true
  package-xml:
    description: 'Path to a package.xml to scope the audit. Optional.'
    required: false
    default: ''

  policies:
    description: 'Path to a Cedar policy bundle (dir of .cedar files) for custom org rules. Empty = built-in baseline policies.'
    required: false
    default: ''

  severity-threshold:
    description: 'Minimum severity to include. One of: info, low, medium, high, critical.'
    required: false
    default: 'medium'
  fail-on-severity:
    description: 'Exit non-zero if any finding meets or exceeds this severity. Set to "never" to disable.'
    required: false
    default: 'high'

  report-path:
    description: 'Where to write the findings JSON report.'
    required: false
    default: 'security-findings.json'
  sarif:
    description: 'Also emit a SARIF report for GitHub Code Scanning.'
    required: false
    default: 'true'
  sarif-path:
    description: 'Where to write the SARIF report (only used when sarif=true).'
    required: false
    default: 'security-findings.sarif'

  upload-sarif:
    description: 'Upload the SARIF report to GitHub Code Scanning (requires security-events: write).'
    required: false
    default: 'true'
  comment-pr:
    description: 'Post a findings summary as a PR comment on pull_request events.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Upload the JSON report (and SARIF if generated) as a workflow artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Artifact name when upload-artifact=true.'
    required: false
    default: 'security-findings'

  version:
    description: 'sf-permissions-audit release tag to download (e.g. v0.4.2). "latest" resolves the most recent release.'
    required: false
    default: 'latest'
  binary-repo:
    description: 'GitHub repo that publishes the sf-permissions-audit binary releases.'
    required: false
    default: 'busbar-actions/actions-dist'

outputs:
  findings-count:
    description: 'Total findings at or above the severity threshold.'
    value: ${{ steps.audit.outputs.findings-count }}
  critical-count:
    description: 'Number of Critical-severity findings.'
    value: ${{ steps.audit.outputs.critical-count }}
  high-count:
    description: 'Number of High-severity findings.'
    value: ${{ steps.audit.outputs.high-count }}
  medium-count:
    description: 'Number of Medium-severity findings.'
    value: ${{ steps.audit.outputs.medium-count }}
  threshold-breached:
    description: '"true" if any finding met or exceeded fail-on-severity.'
    value: ${{ steps.audit.outputs.threshold-breached }}
  report-path:
    description: 'Path to the JSON findings report.'
    value: ${{ inputs.report-path }}
  sarif-path:
    description: 'Path to the SARIF report (empty if sarif=false).'
    value: ${{ steps.audit.outputs.sarif-path }}

# The binary owns all logic and UX: it reads its inputs from INPUT_*, computes
# the finding counts, writes GITHUB_OUTPUT, the step summary, annotations and the
# PR-comment body, and exits non-zero when the fail-on threshold is breached.
# This action only installs it, passes inputs through, and wires the three
# GitHub-native publish steps (Code Scanning, artifact, PR comment).
runs:
  using: 'composite'
  steps:
    - name: Install the sf-permissions-audit binary from actions-dist
      uses: busbar-actions/setup@main
      with:
        binary: sf-permissions-audit
        version: ${{ inputs.version }}
        binary-repo: ${{ inputs.binary-repo }}

    - name: Run the Cedar permissions/sharing/FLS/flow audit over the metadata at ${{ inputs.metadata-path }}
      id: audit
      shell: bash
      env:
        INPUT_METADATA_PATH: ${{ inputs.metadata-path }}
        INPUT_PACKAGE_XML: ${{ inputs.package-xml }}
        INPUT_POLICIES: ${{ inputs.policies }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_REPORT_PATH: ${{ inputs.report-path }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_SARIF_PATH: ${{ inputs.sarif-path }}
        INPUT_COMMENT_OUTPUT: ${{ runner.temp }}/permissions-audit-comment.md
      run: |
        set -euo pipefail
        echo "Auditing metadata at ${INPUT_METADATA_PATH} (severity-threshold='${INPUT_SEVERITY_THRESHOLD}' fail-on='${INPUT_FAIL_ON_SEVERITY}') -> report ${INPUT_REPORT_PATH}"
        sf-permissions-audit

    - name: Upload the permissions-audit SARIF report to GitHub Code Scanning
      if: always() && inputs.sarif == 'true' && inputs.upload-sarif == 'true' && steps.audit.outputs.sarif-path != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.audit.outputs.sarif-path }}
        category: busbar-permissions-audit

    - name: Upload the permissions-audit findings JSON and SARIF as a workflow artifact
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.report-path }}
          ${{ steps.audit.outputs.sarif-path }}
        if-no-files-found: error

    - name: Post the permissions-audit findings summary as a PR comment
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        body_file="${RUNNER_TEMP}/permissions-audit-comment.md"
        echo "Posting the permissions-audit findings summary from ${body_file} as a comment on PR #${PR_NUMBER}"
        gh pr comment "$PR_NUMBER" --body-file "$body_file"
